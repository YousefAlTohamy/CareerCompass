server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $php_upstream backend-api:9000;
    set $frontend_upstream frontend:5173;
    set $ai_upstream ai-cv-analyzer:8000;

    # Backend API (Laravel PHP-FPM)
    location ~ ^/(api|storage|sanctum|_debugbar) {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_X_REQUEST_ID $http_x_request_id;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 240s;
        fastcgi_read_timeout 240s;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Frontend (Vite)
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # AI CV Analyzer (FastAPI) - Optional if needed through proxy
    location /ai-cv {
        proxy_pass http://$ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
