name: Python Services

on:
  pull_request:
    paths:
      - "ai-cv-analyzer/**"
      - "ai-job-miner/**"
      - ".github/workflows/python-services.yml"
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "ai-cv-analyzer/**"
      - "ai-job-miner/**"
      - ".github/workflows/python-services.yml"

concurrency:
  group: python-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and Test Python Services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        service:
          - ai-cv-analyzer
          - ai-job-miner

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall .

      - name: Run tests when present
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory for ${{ matrix.service }}"
          fi
