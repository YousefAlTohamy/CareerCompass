name: Python Services

on:
  pull_request:
    paths:
      - "ai-cv-analyzer/**"
      - "ai-job-miner/**"
      - ".github/workflows/python-services.yml"
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "ai-cv-analyzer/**"
      - "ai-job-miner/**"
      - ".github/workflows/python-services.yml"

concurrency:
  group: python-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and Test Python Services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        service:
          - ai-cv-analyzer
          - ai-job-miner

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test tooling
        run: pip install pytest httpx

      - name: Compile source
        run: python -m compileall .

      - name: Run tests when present
        run: |
          if [ "${{ matrix.service }}" = "ai-cv-analyzer" ]; then
            echo "::notice title=Manual ai-cv-analyzer scripts skipped::The existing test_cv.py and test_local_model.py files are manual smoke scripts that require a live service/model load. Running current FastAPI service tests instead."
            python -m pytest -q tests/test_service_api.py
            exit 0
          fi

          if [ "${{ matrix.service }}" = "ai-job-miner" ]; then
            echo "::notice title=Legacy ai-job-miner tests skipped::The remaining legacy pytest suites target removed core/pipeline modules from the pre-Scrapy architecture. Running current AI utility and service_api tests instead."
            python -m pytest -q tests/test_ai.py tests/test_service_api.py
            exit 0
          fi

          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory for ${{ matrix.service }}"
          fi
