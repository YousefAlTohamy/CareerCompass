name: Security

on:
  pull_request:
  push:
    branches: ["main", "master", "develop"]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secrets and Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Composer audit
        working-directory: backend-api
        run: composer audit --no-interaction || true

      - name: NPM audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Python dependency advisory scan
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r ai-cv-analyzer/requirements.txt || true
          pip-audit -r ai-job-miner/requirements.txt || true
