name: Docker

on:
  pull_request:
    paths:
      - "docker-compose*.yml"
      - "backend-api/Dockerfile"
      - "frontend/Dockerfile"
      - "ai-cv-analyzer/Dockerfile"
      - "ai-job-miner/Dockerfile"
      - "docker/**"
      - ".github/workflows/docker.yml"
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "docker-compose*.yml"
      - "backend-api/Dockerfile"
      - "frontend/Dockerfile"
      - "ai-cv-analyzer/Dockerfile"
      - "ai-job-miner/Dockerfile"
      - "docker/**"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compose and Image Validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build runtime images
        run: docker compose build backend-api frontend ai-cv-analyzer ai-job-miner

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Smoke boot core stack
        run: bash scripts/smoke/docker-smoke.sh
