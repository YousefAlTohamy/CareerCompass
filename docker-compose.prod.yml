services:
  backend-api:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: structured
      FILESYSTEM_DISK: s3
      CV_STORAGE_DISK: s3
      CV_STORAGE_PREFIX: cv-uploads
      CV_UPLOAD_RETENTION_DAYS: 365
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-careercompass}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-minio-password}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: career-compass
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: ${AWS_URL:-http://localhost:9000/career-compass}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MONITORING_TOKEN: ${MONITORING_TOKEN:-production-monitoring-token}
      LARAVEL_INTERNAL_API_URL: http://nginx/api/v1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M

  backend-worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
