    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      VITE_API_URL: /api/v1
      VITE_API_PROXY_TARGET: http://nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M

  ai-cv-analyzer:
    environment:
      CV_TIMEOUT_SECONDS: ${CV_TIMEOUT_SECONDS:-90}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M

  ai-job-miner:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M

  nginx:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-careercompass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-careercompass-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    networks:
      - cc-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done &&
      mc mb --ignore-existing local/career-compass &&
      mc anonymous set none local/career-compass &&
      exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-careercompass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-careercompass-secret}
    restart: "no"
    networks:
      - cc-network

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    environment:
      MONITORING_TOKEN: ${MONITORING_TOKEN:-production-monitoring-token}
    entrypoint:
      - /bin/sh
      - -c
      - >
        sed "s/__MONITORING_TOKEN__/$${MONITORING_TOKEN}/g" /etc/prometheus/prometheus.yml.tpl > /etc/prometheus/prometheus.yml &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    restart: unless-stopped
    networks:
      - cc-network

  grafana:
    image: grafana/grafana-oss:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - cc-network

volumes:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  cc-network:
    driver: bridge
