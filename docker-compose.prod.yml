      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: structured
      FILESYSTEM_DISK: s3
      CV_STORAGE_DISK: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-careercompass}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-minio-password}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: career-compass
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: ${AWS_URL:-http://localhost:9000/career-compass}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
